<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14130f" />
  <title>Aide - Offline</title>
  <!-- Static fallback served by the service worker. Dark edition, the app
       default: same tokens as the .dark palette in src/app/globals.css. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14130f;
      color: #f2ede2;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 360px;
      border: 1px solid #6b675d;
      padding: 2rem;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; letter-spacing: -0.01em; }
    p { color: #b3ada0; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #a3231d;
      color: #f2ede2;
      border: 1px solid #a3231d;
      padding: 0.75rem 2rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#128268;</div>
    <h1>You're Offline</h1>
    <p>Aide works offline. Some features may be limited until your connection is restored.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
