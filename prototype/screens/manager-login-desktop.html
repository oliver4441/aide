<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "on-error": "#ffffff",
                        "on-primary-fixed": "#3d0027",

                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#474647",
                        "on-surface-variant": "#524349",
                        "warning-amber": "#f59e0b",
                        "secondary-fixed": "#efdee8",

                        "surface-container": "#e7eefe",
                        "primary-container": "#8b3d67",
                        "surface-container-highest": "#dce2f3",
                        "background": "#f9f9ff",

                        "surface-tint": "#92436d",
                        "error": "#ba1a1a",
                        "surface-variant": "#dce2f3",

                        "surface-plum": "#f4eff1",
                        "primary-fixed": "#ffd8e7",
                        "on-surface": "#151c27",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e2e8f8",
                        "inverse-primary": "#ffafd4",
                        "primary": "#6f264f",
                        "surface-container-low": "#f0f3ff",
                        "on-primary-container": "#ffbcda",
                        "danger-rose": "#e11d48",
                        "tertiary": "#424142",
                        "secondary-fixed-dim": "#d2c2cc",
                        "on-secondary-fixed": "#221920",
                        "surface-dim": "#d3daea",
                        "primary-fixed-dim": "#ffafd4",
                        "secondary": "#675b63",
                        "surface-bright": "#f9f9ff",
                        "on-secondary-container": "#6d6169",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-lg": "32px",
                        "margin-desktop": "40px",

                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Manrope"],
                        "body-lg": ["Inter"],

                },
            },
        }

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(139, 61, 103, 0.1);
            border-color: theme('colors.primary');
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-gutter font-body-md antialiased bg-surface-container-low">
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl border border-surface-variant p-stack-lg flex flex-col gap-stack-lg shadow-[0_12px_32px_rgba(139,61,103,0.04)]">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-unit">
<span class="font-display-lg text-display-lg text-on-primary-container">BH</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Manager access</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">
                Secure private business workspace. Authorized personnel only.
            </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="manager-name">Manager name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-surface-plum border border-transparent rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant transition-all input-glow" id="manager-name" placeholder="Enter full name" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="manager-pin">PIN</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-plum border border-transparent rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant transition-all input-glow tracking-widest" id="manager-pin" placeholder="••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-sm mt-stack-sm">
<button class="w-full bg-primary-container text-on-primary-container hover:bg-primary hover:text-on-primary font-headline-md text-headline-md !text-[16px] py-3 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm" type="submit">
                    Enter manager workspace
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
<button class="w-full text-primary hover:bg-surface-plum font-body-sm text-body-sm font-semibold py-3 rounded-lg transition-colors" type="button">
                    Forgot PIN?
                </button>
</div>
</form>
<!-- Footer -->
<div class="text-center mt-stack-sm pt-stack-sm border-t border-surface-variant">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                Beauty Hub Salon Management System
             </p>
</div>
</main>
<script>
        // Simple password toggle interaction
        const pinInput = document.getElementById('manager-pin');
        const toggleBtn = pinInput.nextElementSibling;
        const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                pinInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
