name: Desktop App Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      checksums_tag:
        description: 'Also publish SHA-256 checksums for an already-released desktop tag (e.g. desktop-v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Single job to build Next.js standalone + generate capacitor manifest + vendor deps
  # Runs on Linux (Ubuntu) — fastest and shell-compatible
  prepare:
    name: Prepare Electron app (Next.js + Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: dummy
          NEXT_PUBLIC_SENTRY_DSN: ""
          ADMIN_EMAILS: ""

      - name: Build Next.js and stage for Electron
        run: pnpm run desktop:build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: dummy
          NEXT_PUBLIC_SENTRY_DSN: ""
          ADMIN_EMAILS: ""

      - name: Generate Capacitor Electron manifest
        run: |
          CAPACITOR_ROOT_DIR=${{ github.workspace }} \
          CAPACITOR_WEB_DIR=${{ github.workspace }}/electron/next \
          node ${{ github.workspace }}/node_modules/@capawesome/capacitor-electron/dist/cli/index.js update
        working-directory: electron

      - name: Vendor Electron dependencies
        run: npm run vendor
        working-directory: electron

      - name: Install Electron dependencies (for TypeScript build)
        run: npm ci
        working-directory: electron

      - name: Upload staged electron app
        uses: actions/upload-artifact@v4
        with:
          name: electron-staged
          path: electron/
          if-no-files-found: error
          retention-days: 30

  # Per-OS packaging jobs — each downloads the pre-staged app and builds
  build-windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download staged electron app
        uses: actions/download-artifact@v4
        with:
          name: electron-staged
          path: electron

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Decode Windows code-signing secret
        shell: bash
        env:
          WIN_CSC_KEY_B64: ${{ secrets.WIN_CSC_LINK_B64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          :>"$RUNNER_TEMP/win_csc.p12"
          if [ -n "$WIN_CSC_KEY_B64" ]; then
            echo "$WIN_CSC_KEY_B64" | base64 -d > "$RUNNER_TEMP/win_csc.p12"
            echo "WIN_CSC_LINK=$RUNNER_TEMP/win_csc.p12" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build Windows package
        working-directory: electron
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert Windows release is signed
        working-directory: electron
        shell: bash
        env:
          EXPECTED_SIGNED: ${{ env.WIN_CSC_LINK != '' }}
        run: |
          if [ "$EXPECTED_SIGNED" = "false" ]; then
            echo "::warning::Signing secret not configured for Windows; publishing an unsigned artifact."
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download staged electron app
        uses: actions/download-artifact@v4
        with:
          name: electron-staged
          path: electron

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Decode macOS code-signing secret
        shell: bash
        env:
          CSC_KEY_B64: ${{ secrets.CSC_LINK_B64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          :>"$RUNNER_TEMP/csc.p12"
          if [ -n "$CSC_KEY_B64" ]; then
            echo "$CSC_KEY_B64" | base64 -d > "$RUNNER_TEMP/csc.p12"
            echo "CSC_LINK=$RUNNER_TEMP/csc.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build macOS package
        working-directory: electron
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert macOS release is signed
        working-directory: electron
        shell: bash
        env:
          EXPECTED_SIGNED: ${{ env.CSC_LINK != '' }}
        run: |
          if [ "$EXPECTED_SIGNED" = "false" ]; then
            echo "::warning::Signing secret not configured for macOS; publishing an unsigned artifact."
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: electron/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-zip
          path: electron/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download staged electron app
        uses: actions/download-artifact@v4
        with:
          name: electron-staged
          path: electron

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Linux package
        working-directory: electron
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            electron/dist/*.deb
            electron/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-zip
          path: electron/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine publication mode and source commit
        id: mode
        env:
          SOURCE_SHA: $(git rev-parse HEAD)
        run: |
          set -euo pipefail
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub API releases for changelog source references
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          echo "releases_json=$RUNNER_TEMP/releases.json" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ steps.mode.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${{ steps.mode.outputs.source_sha }}" \
            --jq .body > "$RUNNER_TEMP/source-notes.md"

          {
            echo '## Desktop-specific changes'
            echo ''
            echo 'This is a desktop release of Aide.'
          } > "$RUNNER_TEMP/desktop-notes.md"

          cat "$RUNNER_TEMP/desktop-notes.md" "$RUNNER_TEMP/source-notes.md" > "$RUNNER_TEMP/final-notes.md"

          echo "changelog=$RUNNER_TEMP/final-notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aide Desktop v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          body_path: ${{ steps.notes.outputs.changelog }}
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publish SHA-256 checksums
    needs: [build-windows, build-macos, build-linux, release]
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.checksums_tag != '') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.checksums_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download the published assets
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo oliver4441/aide --pattern '*' --dir dist
          ls -la dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge hashes into public/apk-checksums.json
        run: node scripts/update-checksums.mjs dist "$TAG"

      - name: Commit the checksums
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk-checksums.json
          if git diff --staged --quiet; then
            echo "Checksums unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(checksums): SHA-256 for $TAG [skip ci]"
          git push origin HEAD:master