name: Desktop App Release

on:
  push:
    branches: [ master ]
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      checksums_tag:
        description: 'Also publish SHA-256 checksums for an already-released desktop tag (e.g. desktop-v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the others.
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            script: build:win
            artifact: desktop-windows
            paths: |
              electron/dist/*.exe
          - label: Linux
            os: ubuntu-latest
            script: build:linux
            artifact: desktop-linux
            paths: |
              electron/dist/*.deb
              electron/dist/*.AppImage
          - label: macOS
            os: macos-latest
            script: build:mac
            artifact: desktop-macos
            paths: |
              electron/dist/*.dmg
              electron/dist/*.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install app dependencies
        run: npm ci

      # Each packaging target must run on its own OS: a macOS .dmg cannot be
      # produced on Linux, and Windows packaging is most reliable on Windows.
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build ${{ matrix.label }} package
        working-directory: electron
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ${{ matrix.label }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop release
    needs: build
    # Only publish from a desktop-v* tag, so day-to-day pushes just verify the build.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Distinct from the Android tags (v1.0.x) so releases never collide.
          tag_name: ${{ github.ref_name }}
          name: "Aide Desktop v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publish SHA-256 checksums
    needs: [build, release]
    # !cancelled() because `release` is legitimately skipped outside a tag push,
    # and a skipped dependency would otherwise skip this job too.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.checksums_tag != '') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.checksums_tag || github.ref_name }}
    steps:
      # The checksum file lives on master, not on the tag.
      - uses: actions/checkout@v4
        with:
          ref: master

      # Hash the exact bytes that were uploaded. Downloading them again here is
      # the only way to be sure the hash matches what users actually download.
      - name: Download the published assets
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo oliver4441/aide --pattern '*' --dir dist
          ls -la dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge hashes into public/apk-checksums.json
        run: node scripts/update-checksums.mjs dist "$TAG"

      - name: Commit the checksums
        # Never let a checksum push break a release that already went out.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk-checksums.json
          if git diff --staged --quiet; then
            echo "Checksums unchanged — nothing to commit."
            exit 0
          fi
          # [skip ci] stops this commit from triggering another desktop build;
          # Vercel still deploys it, which is what makes the hashes go live.
          git commit -m "chore(checksums): SHA-256 for $TAG [skip ci]"
          git push origin HEAD:master
