name: Desktop App Release

on:
  push:
    branches: [ master ]
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the others.
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            script: build:win
            artifact: desktop-windows
            paths: |
              electron/dist/*.exe
          - label: Linux
            os: ubuntu-latest
            script: build:linux
            artifact: desktop-linux
            paths: |
              electron/dist/*.deb
              electron/dist/*.AppImage
          - label: macOS
            os: macos-latest
            script: build:mac
            artifact: desktop-macos
            paths: |
              electron/dist/*.dmg
              electron/dist/*.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install app dependencies
        run: npm ci

      # Each packaging target must run on its own OS: a macOS .dmg cannot be
      # produced on Linux, and Windows packaging is most reliable on Windows.
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build ${{ matrix.label }} package
        working-directory: electron
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ${{ matrix.label }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop release
    needs: build
    # Only publish from a desktop-v* tag, so day-to-day pushes just verify the build.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Distinct from the Android tags (v1.0.x) so releases never collide.
          tag_name: ${{ github.ref_name }}
          name: "Aide Desktop v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
