name: Android CI

on:
  push:
    branches: [ master, feat/*, fix/*, arena/** ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release metadata and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tests/*.test.mjs
      - name: Validate shell scripts
        run: bash -n scripts/verify-android-apk.sh scripts/smoke-test-android-upgrade.sh scripts/publish-release.sh
      - name: Validate all workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color -shellcheck=

  build:
    name: Android unit tests, lint and builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x android/gradlew
      - name: Unit tests (debug and release), lint and APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease -PaideAllowUnsignedRelease=true --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-and-lint-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - name: Upload debug and UI-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-tests
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  device-tests:
    name: Native update UI (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-tests
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and exercise the native update states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apks/debug/app-debug.apk
            adb shell am start -W -n com.omix.aide.debug/com.omix.aide.MainActivity
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.omix.aide.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q '^OK (' instrumentation.txt
      - name: Upload device test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-update-ui-api-${{ matrix.api }}
          path: instrumentation.txt
