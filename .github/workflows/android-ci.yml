name: Android CI

on:
  push:
    branches: [ master, feat/*, fix/* ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          mkdir -p build
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee build/unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Report test failures as annotations
        # A red check with no readable output is not much use in a review. This
        # surfaces the compiler errors and failing assertions on the run itself
        # so nobody has to download the raw log to see what broke.
        if: failure()
        run: |
          log=android/build/unit-tests.log
          [ -f "$log" ] || exit 0
          grep -nE "^e: |FAILED|expected:|Exception" "$log" | head -n 25 | while IFS= read -r line; do
            echo "::error title=Unit tests::${line}"
          done || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK (unsigned, to cover R8)
        # Keeps minification and resource shrinking honest on every PR. The
        # release build hard-errors without a keystore, so opt out explicitly.
        run: |
          cd android
          ./gradlew assembleRelease -PaideAllowUnsignedRelease=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
