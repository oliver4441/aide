name: Android Auto Release
run-name: "Auto publish after Android CI run #${{ github.event.workflow_run.run_number }}"

# Publish only after the normal Android CI succeeds on master. PR builds and
# feature-branch builds never create public releases.
on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: write

# Serialize version selection and release dispatch so two successful master
# builds cannot choose the same next version at the same time.
concurrency:
  group: android-auto-release-master
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Choose the next Android release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node scripts/android-release.mjs next "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/next.json"
          cat "$RUNNER_TEMP/next.json"
          NEXT_TAG=$(jq -r .tag "$RUNNER_TEMP/next.json")
          if gh api "repos/$REPOSITORY/git/ref/tags/$NEXT_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $NEXT_TAG already exists. Review the incomplete release before retrying."
            exit 1
          fi

      - name: Dispatch the signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run android-release.yml \
            --repo "$REPOSITORY" \
            --ref master \
            -f version="$RELEASE_TAG" \
            -f publish=true \
            -f target_sha="$TARGET_SHA"

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUNS=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow android-release.yml \
              --event workflow_dispatch \
              --branch master \
              --limit 20 \
              --json databaseId,createdAt,event,headBranch)
            RUN_ID=$(jq -r --arg started "$STARTED_AT" '
              [ .[]
                | select(.event == "workflow_dispatch" and .headBranch == "master" and .createdAt >= $started)
              ]
              | sort_by(.createdAt)
              | last
              | .databaseId // empty
            ' <<< "$RUNS")
            [ -n "$RUN_ID" ] && break
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::The Android Release workflow did not start after dispatch."
            exit 1
          fi

          echo "Watching signed release workflow run $RUN_ID."
          gh run watch "$RUN_ID" --repo "$REPOSITORY" --exit-status --interval 10
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json url,assets \
            --jq '.url, (.assets[].name)'
