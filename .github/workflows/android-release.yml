name: Android Release
run-name: "Signed Android ${{ inputs.version || github.ref_name }}${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish && ' (validation only)' || '' }}"

on:
  push:
    tags: ['v*']
    # Branch pushes validate the REAL production key and in-place upgrades,
    # without requiring workflow-dispatch privileges or publishing anything.
    branches: [arena/**, feat/*, fix/*]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version tag, optionally with an explicit build number (v1.0.13+1013)'
        required: true
        type: string
      target_sha:
        description: 'Optional commit to build; publishing is restricted to master history'
        required: false
        type: string
      publish:
        description: 'Publish after all checks pass (false only validates signing and upgrades)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify production signature
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.version_code }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      previous_code: ${{ steps.version.outputs.previous_code }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      publish: ${{ steps.mode.outputs.publish }}
      source_sha: ${{ steps.mode.outputs.source_sha }}
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine validation or publication mode
        id: mode
        env:
          SHOULD_PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$SHOULD_PUBLISH" = true ]; then
            git merge-base --is-ancestor "$SHA" origin/master || { echo '::error::Only reviewed master history may be published'; exit 1; }
          fi
          echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Select a strictly increasing Android build number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if [ -n "$TAG" ]; then
            node scripts/android-release.mjs resolve "$TAG" "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/version.json"
          else
            node scripts/android-release.mjs next "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/version.json"
          fi
          cat "$RUNNER_TEMP/version.json"
      - name: Decode the existing release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo '::error::Existing Android release signing secret is missing. Do not generate a replacement key.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aide-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aide-release.jks" >> "$GITHUB_ENV"
      - name: Test and build the signed, minified production APK
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set +e
          ./gradlew testDebugUnitTest testReleaseUnitTest assembleRelease -PaideVersionName="$VERSION" -PaideVersionCode="$CODE" --console=plain 2>&1 | tee build/signed-validation.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" != 0 ]; then python3 ../scripts/annotate-android-failures.py build/signed-validation.log; fi
          exit "$STATUS"
      - name: Collect the exact APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/aide-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$SUM" "$(basename "$APK")" > "$APK.sha256"
      - name: Verify production certificate, signature schemes, alignment and identity
        id: verify
        env:
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: scripts/verify-android-apk.sh "$APK" "$VERSION" "$CODE"
      - name: Save verified release metadata
        env:
          VERSION_JSON: ${{ runner.temp }}/version.json
          FILENAME: ${{ steps.apk.outputs.filename }}
          SIZE: ${{ steps.apk.outputs.size }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const version = JSON.parse(readFileSync(process.env.VERSION_JSON, 'utf8'));
          writeFileSync('dist/release-metadata.json', JSON.stringify({...version, package:'com.omix.aide', filename:process.env.FILENAME, size:Number(process.env.SIZE), sha256:process.env.SHA256, cert_sha256:process.env.CERT}, null, 2));
          JS
      - name: Upload verified APK and metadata
        uses: actions/upload-artifact@v4
        with:
          name: aide-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload production unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-test-reports
          path: |
            android/app/build/test-results/
            android/build/signed-validation.log
      - name: Remove decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/aide-release.jks"

  compatibility:
    name: Signed in-place upgrade (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist
      - name: Download and verify the previous production APK
        if: needs.build.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.previous_tag }}
          VERSION: ${{ needs.build.outputs.previous_version }}
          CODE: ${{ needs.build.outputs.previous_code }}
        run: |
          mkdir -p previous
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          mapfile -t APKS < <(find previous -name '*.apk')
          [ "${#APKS[@]}" = 1 ] || { echo '::error::Previous release must have one universal production APK'; exit 1; }
          scripts/verify-android-apk.sh "${APKS[0]}" "$VERSION" "$CODE"
          echo "PREVIOUS_APK=${APKS[0]}" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install old production APK, upgrade without uninstalling, launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: scripts/smoke-test-android-upgrade.sh "${PREVIOUS_APK:-}" "dist/aide-${{ needs.build.outputs.version }}.apk" "${{ needs.build.outputs.code }}"
      - name: Save installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-api-${{ matrix.api }}
          path: android-runtime.txt

  publish:
    name: Publish verified GitHub distribution
    needs: [build, compatibility]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist
      - name: Generate release notes and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > dist/CHANGELOG.md
          node scripts/android-release.mjs manifest dist/release-metadata.json "dist/aide-$VERSION.apk" dist/CHANGELOG.md dist/android-update.json
          {
            cat dist/CHANGELOG.md
            echo
            echo '### Verified Android distribution'
            jq -r '"Package: `\(.package)` · Version: `\(.version)` (`\(.version_code)`)\n\nAPK SHA-256: `\(.sha256)`\n\nSigning certificate SHA-256: `\(.cert_sha256)`"' dist/release-metadata.json
            echo
            echo 'Install this over an existing production build to retain local data. Android always asks for installation confirmation. A debug/legacy copy signed with a different key cannot be upgraded in place; export your data before making any changes. Do not uninstall just to retry a failed download.'
          } > dist/RELEASE.md
      - name: Upload to a draft, verify every asset, then make it public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          set -euo pipefail
          # No --clobber: an already-published version is immutable.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Aide v$VERSION ($CODE)" --draft --notes-file dist/RELEASE.md \
            "dist/aide-$VERSION.apk" "dist/aide-$VERSION.apk.sha256" dist/android-update.json dist/CHANGELOG.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published.json"
          node --input-type=module <<'JS'
          import {readFileSync, statSync} from 'node:fs';
          const release = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/published.json', 'utf8'));
          for (const name of ['aide-' + process.env.VERSION + '.apk', 'aide-' + process.env.VERSION + '.apk.sha256', 'android-update.json', 'CHANGELOG.md']) {
            const matches = release.assets.filter(a => a.name === name && a.state === 'uploaded' && a.size === statSync('dist/' + name).size);
            if (matches.length !== 1) throw new Error('Missing or incomplete release asset: ' + name);
          }
          JS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'

  checksums:
    name: Publish SHA-256 checksums
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist
      - run: node scripts/update-checksums.mjs dist "${{ needs.build.outputs.tag }}"
      - name: Commit website checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk-checksums.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore(checksums): SHA-256 for ${{ needs.build.outputs.tag }} [skip ci]"
          git push origin HEAD:master
