name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed native Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Android project
        run: test -f android/gradlew && test -f android/settings.gradle.kts -o -f android/settings.gradle

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aide-release.keystore"
          chmod 600 "$RUNNER_TEMP/aide-release.keystore"

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lint

      - name: Run Android tests
        working-directory: android
        run: ./gradlew test

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aide-release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Generate SHA-256 checksums
        run: |
          sha256sum android/app/build/outputs/apk/release/*.apk | tee aide-release-apk-sha256.txt
          sha256sum android/app/build/outputs/bundle/release/*.aab | tee aide-release-aab-sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            aide-release-apk-sha256.txt
            aide-release-aab-sha256.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aide-release.keystore"
