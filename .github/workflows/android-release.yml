name: Android Release
run-name: "Signed Android ${{ inputs.version || github.ref_name }}${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish && ' (validation only)' || '' }}"

on:
  push:
    tags: ['v*']
    # Branch pushes validate the REAL production key and in-place upgrades,
    # without requiring workflow-dispatch privileges or publishing anything.
    branches: [arena/**, feat/*, fix/*]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version tag, optionally with an explicit build number (v1.0.14+1014)'
        required: true
        type: string
      target_sha:
        description: 'Optional commit to build; publishing is restricted to master history'
        required: false
        type: string
      publish:
        description: 'Publish after all checks pass (false only validates signing and upgrades)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Real publications serialize globally; obsolete branch validations can be
  # superseded without cancelling a release or blocking another review branch.
  group: android-signed-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'publication' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}

jobs:
  build:
    name: Build and verify production signature
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.version_code }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      previous_code: ${{ steps.version.outputs.previous_code }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      publish: ${{ steps.mode.outputs.publish }}
      source_sha: ${{ steps.mode.outputs.source_sha }}
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Determine publication mode and source commit
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          PUBLISH=false
          if [[ "$REF" == refs/tags/v* ]] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PUBLISH" = "true" ]; }; then
            git fetch origin master
            if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/master; then
              echo "::error::Refusing to publish commit $SOURCE_SHA because it is not on master history."
              exit 1
            fi
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build an unsigned production APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Resolve version and monotonic build number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if [[ "$REF" == refs/tags/v* ]]; then
            node scripts/android-release.mjs resolve "$REF_NAME" "$RUNNER_TEMP/releases.json"
          elif [ -n "$INPUT_VERSION" ]; then
            node scripts/android-release.mjs resolve "$INPUT_VERSION" "$RUNNER_TEMP/releases.json"
          else
            if ! node scripts/android-release.mjs next "$RUNNER_TEMP/releases.json"; then
              if [ "$PUBLISH" = "true" ]; then
                exit 1
              fi
              FALLBACK_NAME=$(grep -E '^versionName=' android/version.properties | cut -d= -f2)
              FALLBACK_CODE=$(grep -E '^versionCode=' android/version.properties | cut -d= -f2)
              {
                echo "tag=v${FALLBACK_NAME}+${FALLBACK_CODE}"
                echo "version=${FALLBACK_NAME}"
                echo "version_code=${FALLBACK_CODE}"
                echo "previous_tag="
                echo "previous_code=0"
                echo "previous_version="
              } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run unit tests and build signed Release APK
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: |
          mkdir -p build
          set +e
          ./gradlew testDebugUnitTest testReleaseUnitTest assembleRelease \
            -PaideVersionName="$VERSION" \
            -PaideVersionCode="$CODE" \
            -PaideLatestVersionCode="$CODE" \
            --console=plain 2>&1 | tee build/signed-validation.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" != 0 ]; then
            python3 ../scripts/annotate-android-failures.py build/signed-validation.log
          fi
          exit "$STATUS"

      - name: Collect and verify signed APK
        id: apk
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed release APK, found ${#APKS[@]}."
            exit 1
          fi
          FILENAME="aide-${VERSION}.apk"
          DEST="dist/$FILENAME"
          cp "${APKS[0]}" "$DEST"
          scripts/verify-android-apk.sh "$DEST" "$VERSION" "$CODE"
          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(stat -c%s "$DEST")
          printf '%s  %s\n' "$SHA256" "$FILENAME" > "dist/${FILENAME}.sha256"
          node --input-type=module <<'JS' > dist/release-metadata.json
          import { readFileSync } from "node:fs";
          const out = readFileSync(process.env.GITHUB_OUTPUT, "utf8");
          const get = (k) => {
            const lines = out.split(/\r?\n/).filter((l) => l.startsWith(k + "="));
            return lines.length ? lines[lines.length - 1].slice(k.length + 1) : "";
          };
          console.log(JSON.stringify({
            tag: process.env.TAG,
            version: process.env.VERSION,
            version_code: Number(process.env.CODE),
            package: get("package") || "com.omix.aide",
            cert_sha256: get("cert_sha256"),
            sha256: process.env.SHA256,
            size: Number(process.env.SIZE),
            filename: process.env.FILENAME,
          }, null, 2));
          JS
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: aide-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload production unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-unit-tests
          path: |
            android/app/build/test-results/
            android/build/signed-validation.log
          if-no-files-found: ignore

  compatibility:
    name: Upgrade compatibility (API ${{ matrix.api }}, ${{ matrix.baseline }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
        baseline: [previous, v1.0.12]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist

      - name: Download and verify baseline production APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.baseline == 'previous' && needs.build.outputs.previous_tag || 'v1.0.12' }}
          VERSION: ${{ matrix.baseline == 'previous' && needs.build.outputs.previous_version || '1.0.12' }}
          CODE: ${{ matrix.baseline == 'previous' && needs.build.outputs.previous_code || '1012' }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::notice::No prior release baseline found; smoke test will validate fresh install."
            echo "PREVIOUS_APK=" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p previous
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous; then
            if [ "${{ matrix.baseline }}" = "v1.0.12" ] && [ "${{ needs.build.outputs.publish }}" != "true" ]; then
              echo "::notice::Baseline release $TAG not found on this repository; skipping baseline install during branch validation."
              echo "PREVIOUS_APK=" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Failed to download baseline APK for $TAG"
            exit 1
          fi
          mapfile -t APKS < <(find previous -name '*.apk')
          [ "${#APKS[@]}" = 1 ] || { echo '::error::Previous release must have one universal production APK'; exit 1; }
          scripts/verify-android-apk.sh "${APKS[0]}" "$VERSION" "$CODE"
          echo "PREVIOUS_APK=${APKS[0]}" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install old production APK, upgrade without uninstalling, launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: scripts/smoke-test-android-upgrade.sh "${PREVIOUS_APK:-}" "dist/aide-${{ needs.build.outputs.version }}.apk" "${{ needs.build.outputs.code }}"

      - name: Save installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-api-${{ matrix.api }}-${{ matrix.baseline }}
          path: |
            android-runtime.txt
            android-previous-runtime.txt
          if-no-files-found: ignore

  publish:
    name: Publish verified GitHub distribution
    needs: [build, compatibility]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist

      - name: Generate release notes and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > "$RUNNER_TEMP/source-notes.md"
          {
            cat android/release-notes.md
            echo
            echo '## Source changes'
            cat "$RUNNER_TEMP/source-notes.md"
          } > dist/CHANGELOG.md
          node scripts/android-release.mjs manifest dist/release-metadata.json "dist/aide-$VERSION.apk" dist/CHANGELOG.md dist/android-update.json
          {
            cat dist/CHANGELOG.md
            echo
            echo '### Verified Android distribution'
            jq -r '"Package: `\(.package)` · Version: `\(.version)` (`\(.version_code)`)\n\nAPK SHA-256: `\(.sha256)`\n\nSigning certificate SHA-256: `\(.cert_sha256)`"' dist/release-metadata.json
            echo
            echo 'Install this over an existing production build to retain local data. Android always asks for installation confirmation. A debug/legacy copy signed with a different key cannot be upgraded in place; export your data before making any changes. Do not uninstall just to retry a failed download.'
          } > dist/RELEASE.md

      - name: Upload to a draft, verify every asset, then make it public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          set -euo pipefail
          # No --clobber: an already-published version is immutable.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Aide v$VERSION ($CODE)" --draft --notes-file dist/RELEASE.md \
            "dist/aide-$VERSION.apk" "dist/aide-$VERSION.apk.sha256" dist/android-update.json dist/CHANGELOG.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published.json"
          node --input-type=module <<'JS'
          import { readFileSync, statSync } from 'node:fs';
          const release = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/published.json', 'utf8'));
          for (const name of ['aide-' + process.env.VERSION + '.apk', 'aide-' + process.env.VERSION + '.apk.sha256', 'android-update.json', 'CHANGELOG.md']) {
            const matches = release.assets.filter(a => a.name === name && a.state === 'uploaded' && a.size === statSync('dist/' + name).size);
            if (matches.length !== 1) throw new Error('Missing or incomplete release asset: ' + name);
          }
          JS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'

  checksums:
    name: Publish SHA-256 checksums
    needs: [build, publish]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist

      - name: Hash only published APK bytes for the website
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mkdir -p dist/website-checksums
          cp "dist/aide-$VERSION.apk" dist/website-checksums/
          node scripts/update-checksums.mjs dist/website-checksums "$TAG"

      - name: Commit website checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk-checksums.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore(checksums): SHA-256 for ${{ needs.build.outputs.tag }} [skip ci]"
          git push origin HEAD:master
