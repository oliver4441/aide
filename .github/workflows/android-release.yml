name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

# Required for softprops/action-gh-release to create the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Secrets are exposed to steps as env vars because the `secrets` context is
      # not available in a step-level `if`. ANDROID_KEYSTORE_PATH is set later,
      # by the decode step, only when there is actually a keystore to decode.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to publish an unsigned APK."
            echo "::error::Add the release keystore as a repository secret, then re-dispatch this tag."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Derive version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag is the single source of truth. Grepping versionName out of
          # build.gradle.kts is what let an APK report itself as 1.0.0 while
          # GitHub said v1.0.1.
          NAME="${TAG#v}"
          if ! printf '%s' "$NAME" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$TAG' does not carry a numeric version (got '$NAME')."
            exit 1
          fi
          # 1.0.3 -> 103
          CODE="${NAME//./}"

          # The committed file is the local-dev fallback; it must not claim a
          # version newer than the tag we are releasing.
          FILE_CODE=$(grep -E 'versionCode\s*=' android/app/build.gradle.kts \
            | grep -oE 'getOrElse\("[0-9]+"\)|[0-9]+' | tail -1 || true)
          if [ -n "${FILE_CODE:-}" ] && [ "$FILE_CODE" -gt "$CODE" ] 2>/dev/null; then
            echo "::error::build.gradle.kts declares versionCode $FILE_CODE, ahead of tag $CODE."
            exit 1
          fi

          echo "version=$NAME" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PaideVersionName="${{ steps.version.outputs.version }}" \
            -PaideVersionCode="${{ steps.version.outputs.version_code }}" \
            -PaideLatestVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Collect APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          mkdir -p dist
          # Versioned filename so the CDN copy in Phase 4 can be cached
          # immutably forever, while /download/apk stays a stable "latest".
          cp "$APK" "dist/aide-${{ steps.version.outputs.version }}.apk"
          echo "path=dist/aide-${{ steps.version.outputs.version }}.apk" >> $GITHUB_OUTPUT
          echo "filename=aide-${{ steps.version.outputs.version }}.apk" >> $GITHUB_OUTPUT
          echo "size=$(stat -c%s "dist/aide-${{ steps.version.outputs.version }}.apk")" >> $GITHUB_OUTPUT

      # "App not installed" on a phone is nearly always one of three things, and
      # none of them are visible from the build: an unsigned or v1-only APK, a
      # certificate that differs from the copy already installed, or a manifest
      # that disagrees with the tag. All three are checked here, before publish.
      - name: Verify the APK's signature and identity
        id: verify
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APKSIGNER="$TOOLS/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"

          # Android 11+ refuses an APK that carries only a v1 (JAR) signature,
          # and reports it as a bare "App not installed".
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error::$APK has no v2 signature; Android 11+ will refuse to install it."
            exit 1
          fi

          CERT_SHA=$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" \
            | sed 's/.*digest:[[:space:]]*//')
          CERT_DN=$(grep -m1 'Signer #1 certificate DN:' "$RUNNER_TEMP/apksigner.txt" \
            | sed 's/.*DN:[[:space:]]*//')
          if [ -z "$CERT_SHA" ]; then
            echo "::error::Could not read the signing certificate digest from apksigner."
            exit 1
          fi

          # The manifest must agree with the tag; a mismatch installs as a
          # downgrade ("App not installed") rather than an update.
          if [ -x "$TOOLS/aapt2" ]; then
            BADGING=$("$TOOLS/aapt2" dump badging "$APK")
          else
            BADGING=$("$TOOLS/aapt" dump badging "$APK")
          fi
          PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)

          echo "package:     $PKG"
          echo "versionName: $NAME"
          echo "versionCode: $CODE"
          echo "certificate: $CERT_SHA"
          echo "subject:     $CERT_DN"

          [ "$PKG" = "com.omix.aide" ] || {
            echo "::error::APK package is '$PKG', expected com.omix.aide"; exit 1; }
          [ "$CODE" = "${{ steps.version.outputs.version_code }}" ] || {
            echo "::error::APK versionCode is '$CODE' but the tag asks for ${{ steps.version.outputs.version_code }}"; exit 1; }
          [ "$NAME" = "${{ steps.version.outputs.version }}" ] || {
            echo "::error::APK versionName is '$NAME' but the tag asks for ${{ steps.version.outputs.version }}"; exit 1; }

          {
            echo "cert_sha256=$CERT_SHA"
            echo "cert_dn=$CERT_DN"
            echo "package=$PKG"
            echo "version_code=$CODE"
            echo "version_name=$NAME"
          } >> "$GITHUB_OUTPUT"

      # A keystore rotation is invisible until a user tries to update and gets
      # "App not installed". Pin the fingerprint in the repository variable
      # ANDROID_CERT_SHA256 and a rotation fails here instead.
      - name: Check the signing certificate has not rotated
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ACTUAL="${{ steps.verify.outputs.cert_sha256 }}"
          if [ -z "${EXPECTED:-}" ]; then
            echo "::warning title=Signing certificate not pinned::Signed with $ACTUAL. Set the repository variable ANDROID_CERT_SHA256 to this value so a future keystore change fails the release instead of users' installs."
            exit 0
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signed with $ACTUAL, but ANDROID_CERT_SHA256 is $EXPECTED. Android will refuse to install this over an existing copy ('App not installed'). If the keystore really was rotated, publish uninstall-first instructions for users, then update the variable."
            exit 1
          fi
          echo "Certificate matches the pinned fingerprint."

      - name: Write the SHA-256 next to the APK
        id: hash
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '%s  %s\n' "$SUM" "$(basename "$APK")" > "$APK.sha256"
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          cat "$APK.sha256"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aide-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aide v${{ steps.version.outputs.version }} (${{ steps.version.outputs.version_code }})"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The asset upload used to be part of the release-creation step, which
      # logged "Uploaded" and still produced a release with zero downloadable
      # files (v1.0.4). It is now a separate, explicit, retried step followed by
      # an assertion, so a release cannot look successful while being empty.
      - name: Upload the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release upload "${{ github.ref_name }}" "$APK_PATH" "$APK_PATH.sha256" \
                 --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "Uploaded on attempt $attempt."
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying."
            sleep 10
          done
          echo "::error::Could not attach $APK_PATH to the release after 5 attempts."
          exit 1

      - name: Assert the release actually has the APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_NAME: ${{ steps.apk.outputs.filename }}
          EXPECTED_SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail
          # There is no releases/tags/{tag}/assets endpoint; the asset list
          # hangs off the release object itself.
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ github.ref_name }}" -q '.assets')
          COUNT=$(echo "$ASSETS" | jq 'length')
          echo "Release has $COUNT asset(s)."
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::The release published with no downloadable file."
            exit 1
          fi
          echo "$ASSETS" | jq -r '.[] | "  \(.name)  \(.size) bytes  state=\(.state)"'
          MATCH=$(echo "$ASSETS" | jq -r --arg n "$EXPECTED_NAME" \
            '[.[] | select(.name == $n and .state == "uploaded")] | length')
          if [ "$MATCH" -ne 1 ]; then
            echo "::error::Expected exactly one uploaded asset named $EXPECTED_NAME; found $MATCH."
            exit 1
          fi
          SIZE=$(echo "$ASSETS" | jq -r --arg n "$EXPECTED_NAME" '.[] | select(.name == $n) | .size')
          if [ "$SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::Asset size $SIZE does not match the built APK ($EXPECTED_SIZE bytes)."
            exit 1
          fi
          # Phones that fail on a corrupt download need the hash to check against.
          HAS_SUM=$(echo "$ASSETS" | jq -r --arg n "$EXPECTED_NAME.sha256" \
            '[.[] | select(.name == $n)] | length')
          if [ "$HAS_SUM" != "1" ]; then
            echo "::error::The release is missing $EXPECTED_NAME.sha256."
            exit 1
          fi
          echo "Release assets verified."


      # People debugging "App not installed" need the certificate and the hash
      # without a terminal: put both in the release body.
      - name: Record the build in the release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PKG: ${{ steps.verify.outputs.package }}
          CODE: ${{ steps.verify.outputs.version_code }}
          NAME: ${{ steps.verify.outputs.version_name }}
          CERT_SHA: ${{ steps.verify.outputs.cert_sha256 }}
          CERT_DN: ${{ steps.verify.outputs.cert_dn }}
          APK_SHA: ${{ steps.hash.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_NAME: ${{ steps.apk.outputs.filename }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            > "$RUNNER_TEMP/body.md" || : > "$RUNNER_TEMP/body.md"
          {
            cat "$RUNNER_TEMP/body.md"
            echo
            echo "---"
            echo
            echo "### Install & verify"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`$PKG\` |"
            echo "| Version | \`$NAME\` (versionCode \`$CODE\`) |"
            echo "| APK | \`$APK_NAME\`, $APK_SIZE bytes |"
            echo "| APK SHA-256 | \`$APK_SHA\` |"
            echo "| Signing certificate | \`$CERT_DN\` |"
            echo "| Certificate fingerprint | \`$CERT_SHA\` |"
            echo
            echo "If Android says **\"App not installed\"**, the copy already on the"
            echo "phone was signed with a different certificate (usually a debug"
            echo "build, or a release from before the keystore changed). Export your"
            echo "data in Settings, uninstall Aide, then install this APK."
          } > "$RUNNER_TEMP/new-body.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/new-body.md"

  checksums:
    name: Publish SHA-256 checksums
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # The checksum file lives on master, not on the tag.
      - uses: actions/checkout@v4
        with:
          ref: master

      # Hash the exact APK that was uploaded to the release.
      - name: Download the published APK
        uses: actions/download-artifact@v4
        with:
          name: aide-release-apk
          path: dist

      - name: Merge hashes into public/apk-checksums.json
        run: node scripts/update-checksums.mjs dist "${{ github.ref_name }}"

      - name: Commit the checksums
        # Never let a checksum push break a release that already went out.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk-checksums.json
          if git diff --staged --quiet; then
            echo "Checksums unchanged — nothing to commit."
            exit 0
          fi
          # [skip ci] stops this commit from triggering another build;
          # Vercel still deploys it, which is what makes the hashes go live.
          git commit -m "chore(checksums): SHA-256 for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:master
