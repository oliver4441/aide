name: Android Release
run-name: "Signed Android ${{ inputs.version || github.ref_name }}${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish && ' (validation only)' || '' }}"

on:
  push:
    tags: ['v*']
    # Branch pushes validate the REAL production key and in-place upgrades,
    # without requiring workflow-dispatch privileges or publishing anything.
    branches: [arena/**, feat/*, fix/*]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version tag, optionally with an explicit build number (v1.0.13+1013)'
        required: true
        type: string
      target_sha:
        description: 'Optional commit to build; publishing is restricted to master history'
        required: false
        type: string
      publish:
        description: 'Publish after all checks pass (false only validates signing and upgrades)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Real publications serialize globally; obsolete branch validations can be
  # superseded without cancelling a release or blocking another review branch.
  group: android-signed-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'publication' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}

jobs:
  build:
    name: Build and verify production signature
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.version_code }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      previous_code: ${{ steps.version.outputs.previous_code }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      publish: ${{ steps.mode.outputs.publish }}
      source_sha: ${{ steps.mode.outputs.source_sha }}
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to publish an unsigned APK."
            echo "::error::Add the release keystore as a repository secret, then re-dispatch this tag."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Derive version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag is the single source of truth. Grepping versionName out of
          # build.gradle.kts is what let an APK report itself as 1.0.0 while
          # GitHub said v1.0.1.
          NAME="${TAG#v}"
          if ! printf '%s' "$NAME" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$TAG' does not carry a numeric version (got '$NAME')."
            exit 1
          fi
          # 1.0.3 -> 103
          CODE="${NAME//./}"

          # The committed file is the local-dev fallback; it must not claim a
          # version newer than the tag we are releasing.
          FILE_CODE=$(grep -E 'versionCode\s*=' android/app/build.gradle.kts \
            | grep -oE 'getOrElse\("[0-9]+"\)|[0-9]+' | tail -1 || true)
          if [ -n "${FILE_CODE:-}" ] && [ "$FILE_CODE" -gt "$CODE" ] 2>/dev/null; then
            echo "::error::build.gradle.kts declares versionCode $FILE_CODE, ahead of tag $CODE."
            exit 1
          fi

          echo "version=$NAME" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PaideVersionName="${{ steps.version.outputs.version }}" \
            -PaideVersionCode="${{ steps.version.outputs.version_code }}" \
            -PaideLatestVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Collect APK
        id: apk
        run: |
          chmod +x gradlew
          mkdir -p build
          set +e
          ./gradlew testDebugUnitTest testReleaseUnitTest assembleRelease -PaideVersionName="$VERSION" -PaideVersionCode="$CODE" --console=plain 2>&1 | tee build/signed-validation.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" != 0 ]; then python3 ../scripts/annotate-android-failures.py build/signed-validation.log; fi
          exit "$STATUS"
      - name: Collect the exact APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Versioned filename so the CDN copy in Phase 4 can be cached
          # immutably forever, while /download/apk stays a stable "latest".
          cp "$APK" "dist/aide-${{ steps.version.outputs.version }}.apk"
          echo "path=dist/aide-${{ steps.version.outputs.version }}.apk" >> $GITHUB_OUTPUT

      - name: Assert the APK is signed
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          if ! "$APKSIGNER" verify --verbose "$APK"; then
            echo "::error::$APK is not a valid signed APK — refusing to publish it."
            exit 1
          fi
          echo "Signed APK verified with build-tools $BUILD_TOOLS."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aide-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload production unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-test-reports
          path: |
            android/app/build/test-results/
            android/build/signed-validation.log
      - name: Remove decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/aide-release.jks"

  compatibility:
    name: Signed in-place upgrade (API ${{ matrix.api }}, ${{ matrix.baseline }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
        # Exercise the reported v12 crash as well as the newest production APK.
        baseline: [previous, v1.0.12]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist
      - name: Download and verify the production upgrade baseline
        if: matrix.baseline != 'previous' || needs.build.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.baseline == 'previous' && needs.build.outputs.previous_tag || 'v1.0.12' }}
          VERSION: ${{ matrix.baseline == 'previous' && needs.build.outputs.previous_version || '1.0.12' }}
          CODE: ${{ matrix.baseline == 'previous' && needs.build.outputs.previous_code || '1012' }}
        run: |
          mkdir -p previous
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          mapfile -t APKS < <(find previous -name '*.apk')
          [ "${#APKS[@]}" = 1 ] || { echo '::error::Previous release must have one universal production APK'; exit 1; }
          scripts/verify-android-apk.sh "${APKS[0]}" "$VERSION" "$CODE"
          echo "PREVIOUS_APK=${APKS[0]}" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install old production APK, upgrade without uninstalling, launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: scripts/smoke-test-android-upgrade.sh "${PREVIOUS_APK:-}" "dist/aide-${{ needs.build.outputs.version }}.apk" "${{ needs.build.outputs.code }}"
      - name: Save installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-api-${{ matrix.api }}-${{ matrix.baseline }}
          path: |
            android-runtime.txt
            android-previous-runtime.txt

  publish:
    name: Publish verified GitHub distribution
    needs: [build, compatibility]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist
      - name: Generate release notes and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > "$RUNNER_TEMP/source-notes.md"
          {
            cat android/release-notes.md
            echo
            echo '## Source changes'
            cat "$RUNNER_TEMP/source-notes.md"
          } > dist/CHANGELOG.md
          node scripts/android-release.mjs manifest dist/release-metadata.json "dist/aide-$VERSION.apk" dist/CHANGELOG.md dist/android-update.json
          {
            cat dist/CHANGELOG.md
            echo
            echo '### Verified Android distribution'
            jq -r '"Package: `\(.package)` · Version: `\(.version)` (`\(.version_code)`)\n\nAPK SHA-256: `\(.sha256)`\n\nSigning certificate SHA-256: `\(.cert_sha256)`"' dist/release-metadata.json
            echo
            echo 'Install this over an existing production build to retain local data. Android always asks for installation confirmation. A debug/legacy copy signed with a different key cannot be upgraded in place; export your data before making any changes. Do not uninstall just to retry a failed download.'
          } > dist/RELEASE.md
      - name: Upload to a draft, verify every asset, then make it public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          set -euo pipefail
          # No --clobber: an already-published version is immutable.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Aide v$VERSION ($CODE)" --draft --notes-file dist/RELEASE.md \
            "dist/aide-$VERSION.apk" "dist/aide-$VERSION.apk.sha256" dist/android-update.json dist/CHANGELOG.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published.json"
          node --input-type=module <<'JS'
          import {readFileSync, statSync} from 'node:fs';
          const release = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/published.json', 'utf8'));
          for (const name of ['aide-' + process.env.VERSION + '.apk', 'aide-' + process.env.VERSION + '.apk.sha256', 'android-update.json', 'CHANGELOG.md']) {
            const matches = release.assets.filter(a => a.name === name && a.state === 'uploaded' && a.size === statSync('dist/' + name).size);
            if (matches.length !== 1) throw new Error('Missing or incomplete release asset: ' + name);
          }
          JS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'

  checksums:
    name: Publish SHA-256 checksums
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: aide-signed-release
          path: dist
      - name: Hash only published APK bytes for the website
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mkdir -p dist/website-checksums
          cp "dist/aide-$VERSION.apk" dist/website-checksums/
          node scripts/update-checksums.mjs dist/website-checksums "$TAG"
      - name: Commit website checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk-checksums.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore(checksums): SHA-256 for ${{ needs.build.outputs.tag }} [skip ci]"
          git push origin HEAD:master
