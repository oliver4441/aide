name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

# Required for softprops/action-gh-release to create the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Secrets are exposed to steps as env vars because the `secrets` context is
      # not available in a step-level `if`. ANDROID_KEYSTORE_PATH is set later,
      # by the decode step, only when there is actually a keystore to decode.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Warn if the release APK will be unsigned
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No keystore configured — assembleRelease will produce an UNSIGNED apk."

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          VERSION_CODE=$(grep -E 'versionCode\s*=' android/app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Collect APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/aide-release.apk
          echo "path=dist/aide-release.apk" >> $GITHUB_OUTPUT

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aide-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aide v${{ steps.version.outputs.version }} (${{ steps.version.outputs.version_code }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publish SHA-256 checksums
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # The checksum file lives on master, not on the tag.
      - uses: actions/checkout@v4
        with:
          ref: master

      # Hash the exact APK that was uploaded to the release.
      - name: Download the published APK
        uses: actions/download-artifact@v4
        with:
          name: aide-release-apk
          path: dist

      - name: Merge hashes into public/apk-checksums.json
        run: node scripts/update-checksums.mjs dist "${{ github.ref_name }}"

      - name: Commit the checksums
        # Never let a checksum push break a release that already went out.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk-checksums.json
          if git diff --staged --quiet; then
            echo "Checksums unchanged — nothing to commit."
            exit 0
          fi
          # [skip ci] stops this commit from triggering another build;
          # Vercel still deploys it, which is what makes the hashes go live.
          git commit -m "chore(checksums): SHA-256 for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:master
